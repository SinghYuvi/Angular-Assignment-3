<h1>Welcome to {{ title() }}</h1>

<button (click)="onDisplayDetails()">Display Details</button>
<p *ngIf="showDetails">Secret Password = Tuna</p>

<div
  *ngFor="let click of buttonClicks; let i = index"
  [ngStyle]="{ backgroundColor: i >= 4 ? 'blue' : 'transparent' }"
  [ngClass]="{ whiteText: i >= 4 }"
>
  Click #{{ click }}
</div>
<router-outlet />
